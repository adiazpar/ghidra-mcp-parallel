name: Shared service package
on:
  workflow_dispatch:
  push:
    branches: [main, shared-program-service]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.11'
      - name: Install bootstrap
        run: python -m pip install uv==0.6.11
      - name: Install isolated development toolchain
        shell: powershell
        run: ./tools/install.ps1
      - name: Check distribution and supervisor contracts
        run: .venv/Scripts/python.exe -m pytest tests/test_plugin.py tests/test_supervisor.py -q
      - name: Test fresh runtime deployment and update
        shell: powershell
        run: ./tests/install_smoke.ps1 -Root "$env:RUNNER_TEMP/shared-ghidra-runtime"
      - name: Build product archive
        shell: powershell
        run: ./tools/package.ps1
      - name: Verify product archive
        run: .venv/Scripts/python.exe -m tools.verify_package
      - uses: actions/upload-artifact@v4
        with:
          name: shared-ghidra-service
          path: dist/*
